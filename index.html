  function generalRecsText() {
    const g = window.GENERAL_RECS || {};
    const items = (g.items || []).map((x, i) => (i + 1) + '. ' + x).join('\n');
    return (g.intro || '') + (items ? '\n' + items : '');
  }

  function getSignature(topic) {
    if (topic.no_signature || topic.group === 'אישורים') return '';
    if (topic.type === 'postpartum') return window.SIGNATURE_POSTPARTUM || window.SIGNATURE;
    return window.SIGNATURE;
  }

  // Large-type view for the screen facing the patient; also the printable handout.
  function pictoHtml(p) {
    const of = Math.min(400, Math.max(10, +p.of || 100)), n = Math.max(0, Math.min(of, +p.n || 0)), cols = of > 100 ? 20 : 10;
    return `<div class="picto-wrap"><div class="picto" style="grid-template-columns: repeat(${cols}, 1fr)">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div><p class="picto-cap">${escapeHtml(p.caption || '')}</p></div>`;
  }
  let closePatientView = null;
  function openPatientView(topic) {
    if (closePatientView) closePatientView();
    const missing = [];
    const take = (txt, scope) => { const r = applyFills(txt || '', scope, ''); missing.push(...r.missing); return r.text.replace(/[ \t]{2,}/g, ' ').replace(/ ([,.:;])/g, '$1'); };
    const d = take(topic.discussion, topic.id + ':d');
    const r = take(topic.recommendations, topic.id + ':r').replace(/^(התוכנית כוללת|ממליץ על התוכנית הבאה):?\s*\n?/, '');
    const warn = !topic.is_us_finding && (topic.warnings_items || []).length;
    const wItems = warn ? topic.warnings_items.map((x, i) => take(x, topic.id + ':w' + i)) : [];
    const pts = topic.teach_points || [];
    const el = document.createElement('div'); el.id = 'patient-view'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'תצוגה למטופלת');
    el.innerHTML = `<div class="pv-actions"><button type="button" class="bar-btn" id="pv-print">🖨 הדפס עלון</button><button type="button" class="bar-btn" id="pv-close">סגור (Esc)</button></div>
      <div class="pv-inner">
        <h1>${escapeHtml(topic.title)}</h1>
        ${pts.length ? `<ul class="pv-points">${pts.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>` : (d ? `<p>${escapeHtml(d)}</p>` : '')}
        ${(topic.pictos || []).map(pictoHtml).join('')}
        ${r ? `<h3>התוכנית</h3><p>${escapeHtml(r)}</p>` : ''}
        ${warn ? `<h3>${escapeHtml((topic.warnings_intro || 'מתי לפנות מיד').replace(/:\s*$/, ''))}</h3><ul>${wItems.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : ''}
        <div class="pv-foot">${escapeHtml((getSignature(topic) || '').replace(/\n/g, ' · '))}</div>
      </div>`;
    document.body.appendChild(el); document.body.classList.add('patient-open');
    [...document.body.children].forEach(c => { if (c !== el) c.inert = true; });
    const close = () => { el.remove(); document.body.classList.remove('patient-open'); document.removeEventListener('keydown', onKey); [...document.body.children].forEach(c => { c.inert = false; }); closePatientView = null; };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    closePatientView = close;
    el.querySelector('#pv-close').addEventListener('click', close);
    el.querySelector('#pv-print').addEventListener('click', () => window.print());
    el.querySelector('#pv-close').focus();
  }

  function warningsFilled(topic) {
    const missing = [];
    const intro = topic.warnings_intro ? applyFills(topic.warnings_intro, topic.id + ':wi') : { text: '', missing: [] };
    missing.push(...intro.missing);
    const items = (topic.warnings_items || []).map((x, n) => { const r = applyFills(x, topic.id + ':w' + n); missing.push(...r.missing); return '• ' + r.text; }).join('\n');
    return { text: intro.text + (items ? '\n' + items : ''), missing };
  }
  // withFills=true returns {text, missing}; false returns the raw text (used by compose, which fills on its own scope)
  function buildBlockText(topic, withFills) {
    const parts = []; const missing = [];
    const take = (txt, scope) => { if (!withFills) return txt; const r = applyFills(txt, scope); missing.push(...r.missing); return r.text; };
    if (topic.template) {
      parts.push(take(topic.template, topic.id + ':t'));
      if (getSignature(topic)) parts.push(getSignature(topic));
      return withFills ? { text: parts.join('\n\n'), missing } : parts.join('\n\n');
    }
    if (topic.discussion) parts.push(take(topic.discussion, topic.id + ':d'));
    if (topic.recommendations) parts.push(take(topic.recommendations, topic.id + ':r'));
    if (!topic.is_us_finding) {
      parts.push(generalRecsText());
      if (topic.warnings_intro || (topic.warnings_items || []).length) {
        if (withFills) { const w = warningsFilled(topic); missing.push(...w.missing); parts.push(w.text); }
        else { const wi = (topic.warnings_items || []).map(x => '• ' + x).join('\n'); parts.push((topic.warnings_intro || '') + (wi ? '\n' + wi : '')); }
      }
    }
    if (getSignature(topic)) parts.push(getSignature(topic));
    return withFills ? { text: parts.join('\n\n'), missing } : parts.join('\n\n');
  }

  function cleanForEmr(t) {
    return String(t || '')
      .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '')
      .replace(/\u00a0/g, ' ')
      .split('\n').map(l => l.replace(/[ \t]+$/g, '')).join('\n')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  function copyText(text, btnEl) {
    text = cleanForEmr(text);
    const showFeedback = () => {
      const orig = btnEl.textContent;
      btnEl.classList.add('copied');
      btnEl.textContent = 'הועתק';
      showToast('הועתק לזיכרון');
      setTimeout(() => {
        btnEl.classList.remove('copied');
        btnEl.textContent = orig;
      }, 1500);
    };
    navigator.clipboard.writeText(text).then(showFeedback).catch(err => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) showFeedback(); else alert('ההעתקה נכשלה. סמן את הטקסט והעתק ידנית (Ctrl+C).');
    });
  }

  function renderTopic(id) {
    if (id === 'compose') { showComposeView(); return; }
    const topic = TOPICS.find(t => t.id === id);
    if (!topic) {
      content.innerHTML = '<div class="welcome"><h2>בחר נושא מהתפריט</h2><p>או חפש בתיבה למעלה</p></div>';
      return;
    }

    // Calculator topics: render with dedicated calculator UI
    if (topic.type === 'calculator') {
      if (topic.calc === 'ga') renderCalculatorGA(content);
      else if (topic.calc === 'fwp') renderCalculatorFWP(content);
      else if (topic.calc === 'microcephaly') renderCalculatorMicrocephaly(content);
      else if (topic.calc === 'bishop') renderCalculatorBishop(content);
      else if (topic.calc === 'clexane') renderCalculatorClexane(content);
      else if (topic.calc === 'bmi') renderCalculatorBMI(content);
      prefillCalculator(topic.calc);
      if (window.innerWidth <= 768) {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      }
      content.scrollTo(0, 0);
      window.scrollTo(0, 0);
      return;
    }

    // Tool topics: render with dedicated tool UI (download page)
    if (topic.type === 'tool') {
      if (topic.tool === 'rupture_review') renderToolRuptureReview(content);
      else if (topic.tool === 'pdf_vault') renderPdfVault(content);
      if (window.innerWidth <= 768) {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      }
      content.scrollTo(0, 0);
      window.scrollTo(0, 0);
      return;
    }

    const g = window.GENERAL_RECS || {};
    const showGeneral = !topic.template && !topic.is_us_finding;
    const showWarnings = !topic.template && !topic.is_us_finding && (topic.warnings_intro || (topic.warnings_items || []).length);

    const templateHtml = topic.template ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">תבנית</h3>
          <button class="copy-btn" data-block="template">העתק</button>
        </div>
        <div class="block-content"><p style="white-space: pre-wrap;">${fieldify(topic.template, topic.id + ':t')}</p></div>
      </div>` : '';

    const generalRecsHtml = showGeneral ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">המלצות כלליות</h3>
          <button class="copy-btn" data-block="general">העתק</button>
        </div>
        <div class="block-content">
          ${g.intro ? `<p>${escapeHtml(g.intro)}</p>` : ''}
          ${(g.items || []).length ? `<ol>${g.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ol>` : ''}
        </div>
      </div>` : '';

    const warningsHtml = showWarnings ? `
      <div class="block block-warn">
        <div class="block-header">
          <h3 class="block-title">סימני אזהרה</h3>
          <button class="copy-btn" data-block="warnings">העתק</button>
        </div>
        <div class="block-content">
          ${topic.warnings_intro ? `<p>${fieldify(topic.warnings_intro, topic.id + ':wi')}</p>` : ''}
          ${(topic.warnings_items || []).length ? `<ul>${topic.warnings_items.map((i, n) => `<li>${fieldify(i, topic.id + ':w' + n)}</li>`).join('')}</ul>` : ''}
        </div>
      </div>` : '';

    const sig = getSignature(topic);
    const signatureHtml = sig ? `
      <div class="signature">
        ${sig.split('\n').map(line => `<div>${escapeHtml(line)}</div>`).join('')}
      </div>` : '';

    const showDiscussion = !topic.template && topic.discussion;
    const showRecs = !topic.template && topic.recommendations;

    const leaveHtml = topic.leave ? `
      <details class="block block-leave">
        <summary><span>שמירת הריון: נימוק רפואי לאישור</span><button class="copy-btn" data-block="leave">העתק</button></summary>
        <div class="leave-note">בלוק נפרד לאישור שמירת הריון (לא נכלל ב"העתק את כל הטקסט").</div>
        <div class="block-content"><p style="white-space: pre-wrap;">${fieldify(topic.leave, topic.id + ':l')}</p></div>
      </details>` : '';
    const teachHtml = (topic.teachback || topic.teach_points) ? `
      <details class="teach-box">
        <summary>בדיקת הבנה בסוף השיחה (לרופא בלבד, לא מועתק)</summary>
        ${(topic.teach_points || []).length ? `<div class="muted">נקודות להסבר בעל פה: ${topic.teach_points.map(escapeHtml).join(' · ')}</div>` : ''}
        ${(topic.teachback || []).length ? `<ul>${topic.teachback.map(q => `<li>${escapeHtml(q)}</li>`).join('')}</ul>` : ''}
      </details>` : '';
    const pinned = getPins().includes(topic.id);

    content.innerHTML = `
      <h2>${escapeHtml(topic.title)}</h2>
      ${topic.group ? `<div class="topic-meta">${escapeHtml(topic.group)}</div>` : '<div class="topic-meta"></div>'}
      ${topic.hint ? `<div class="topic-hint">לרופא: ${escapeHtml(topic.hint)}</div>` : ''}

      <div class="copy-all-bar">
        <button class="copy-all-btn" data-action="copy-all">העתק את כל הטקסט</button>
        ${(!topic.template && topic.discussion) ? '<button type="button" class="bar-btn" id="pv-btn" title="תצוגה גדולה למסך מול המטופלת, עם הדפסת עלון">👁 הצג למטופלת</button>' : ''}
        <button type="button" class="bar-btn${pinned ? ' on' : ''}" id="pin-btn" title="נעיצה בראש התפריט, עם קיצור Alt+מספר">${pinned ? '★ נעוץ' : '☆ נעץ'}</button>
      </div>

      ${templateHtml}

      ${showDiscussion ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">שיחה והסבר</h3>
          <button class="copy-btn" data-block="discussion">העתק</button>
        </div>
        <div class="block-content"><p>${fieldify(topic.discussion, topic.id + ':d')}</p></div>
      </div>` : ''}

      ${showRecs ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">המלצות ומעקב</h3>
          <button class="copy-btn" data-block="recommendations">העתק</button>
        </div>
        <div class="block-content"><p>${fieldify(topic.recommendations, topic.id + ':r')}</p></div>
      </div>` : ''}

      ${leaveHtml}

      ${generalRecsHtml}

      ${warningsHtml}

      ${signatureHtml}

      <div class="disclaimer">
        הטקסטים נכתבו לשימוש כקטעים במכתבי סיכום ביקור. התאם בכל מקרה למצבה הספציפי של המטופלת.
      </div>

      ${teachHtml}

      ${notesBoxHtml(topic.id)}
    `;
    wireNotesBox(topic.id);
    const pinBtn = document.getElementById('pin-btn');
    if (pinBtn) pinBtn.addEventListener('click', () => { togglePin(topic.id); renderTopic(topic.id); });
    const pvBtn = document.getElementById('pv-btn');
    if (pvBtn) pvBtn.addEventListener('click', () => openPatientView(topic));

    content.querySelectorAll('button.copy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        bumpUsage('copies', topic.id);
        const which = btn.dataset.block;
        let r = { text: '', missing: [] };
        if (which === 'template') r = applyFills(topic.template, topic.id + ':t');
        else if (which === 'discussion') r = applyFills(topic.discussion, topic.id + ':d');
        else if (which === 'recommendations') r = applyFills(topic.recommendations, topic.id + ':r');
        else if (which === 'leave') r = applyFills(topic.leave || '', topic.id + ':l');
        else if (which === 'general') r = { text: generalRecsText(), missing: [] };
        else if (which === 'warnings') r = warningsFilled(topic);
        copyChecked(r.text, r.missing, btn);
      });
    });
    content.querySelectorAll('button.copy-all-btn').forEach(btn => {
      btn.addEventListener('click', () => { bumpUsage('copies', topic.id); const r = buildBlockText(topic, true); copyChecked(r.text, r.missing, btn); });
    });

    if (window.innerWidth <= 768) {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
    content.scrollTo(0, 0);
    window.scrollTo(0, 0);
  }

  function onHashChange() {
    if (closePatientView) closePatientView();
    const id = (location.hash || '').slice(1);
    renderTopic(id);
    highlightActive();
    // Push to MRU only for content topics (not calculators/tools)
    const t = TOPICS.find(x => x.id === id);
    if (t && t.type !== 'calculator' && t.type !== 'tool') {
      pushMRU(id);
      bumpUsage('views', id);
      if (!search.value) renderList('');
    }
  }

  search.addEventListener('input', e => renderList(e.target.value));
  window.addEventListener('hashchange', onHashChange);
  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (e.altKey && !e.ctrlKey && !e.metaKey && !inField && /^Digit[1-9]$/.test(e.code || '')) {
      const pins = getPins(); const id = pins[+e.code.slice(5) - 1];
      if (id) { e.preventDefault(); location.hash = '#' + id; }
    } else if (e.key === '/' && !inField) {
      e.preventDefault();
      search.focus();
      search.select();
    } else if (e.key === 'Escape' && document.activeElement === search) {
      search.value = '';
      renderList('');
      search.blur();
    } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
      // Copy whole topic
      const allBtn = document.querySelector('button.copy-all-btn');
      if (allBtn) {
        e.preventDefault();
        allBtn.click();
      }
    }
  });

  // Compose-bar handlers
  document.querySelector('#compose-bar .btn-compose').addEventListener('click', () => {
    if (location.hash === '#compose') showComposeView(); else location.hash = '#compose';
    if (window.innerWidth <= 768) {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
    window.scrollTo(0, 0);
  });
  document.querySelector('#compose-bar .btn-clear').addEventListener('click', () => {
    selected.clear(); extras.length = 0;
    persistSelection();
    renderList(search.value);
  });

  // Restore last topic on first load if no hash
  if (!location.hash) {
    const mru = getMRU();
    if (mru.length > 0) location.hash = '#' + mru[0];
  }

  renderList('');
  onHashChange();
  updateComposeBar();
}
</script>
</body>
</html>
