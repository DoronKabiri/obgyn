<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קטעי טקסט – הריון בסיכון גבוה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1F4E79;
    --primary-light: #4472A8;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --hover: #eef4fb;
    --success: #16a34a;
    --warn-bg: #fff7ed;
    --warn-border: #fed7aa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 14px 22px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    flex-shrink: 0;
  }
  #search {
    flex: 1;
    max-width: 480px;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: background 0.15s;
  }
  #search::placeholder { color: rgba(255,255,255,0.7); }
  #search:focus { background: rgba(255,255,255,0.25); }

  #menu-toggle {
    display: none;
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    font-size: 20px;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
  }

  .layout {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
    min-height: calc(100vh - 60px);
  }

  aside {
    width: 280px;
    flex-shrink: 0;
    background: var(--card-bg);
    border-inline-start: 1px solid var(--border);
    overflow-y: auto;
    height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }
  aside ul {
    list-style: none;
    padding: 8px 0;
    margin: 0;
  }
  aside li a {
    display: block;
    padding: 10px 22px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    border-inline-end: 3px solid transparent;
    transition: background 0.1s, border-color 0.1s;
  }
  aside li a:hover { background: var(--hover); }
  aside li a.active {
    background: var(--hover);
    border-inline-end-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  aside .group-label {
    padding: 14px 22px 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  aside .no-results {
    padding: 22px;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
  }

  main {
    flex: 1;
    padding: 32px 36px;
    max-width: 900px;
  }
  main h2 {
    font-size: 28px;
    color: var(--primary);
    margin: 0 0 8px;
    font-weight: 700;
  }
  main .topic-meta {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 18px;
    position: relative;
  }
  .block-warn {
    background: var(--warn-bg);
    border-color: var(--warn-border);
  }
  .block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
  }
  .block-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
  }
  .block-warn .block-title { color: #c2410c; }
  .block-content {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
  }
  .block-content p { margin: 0 0 10px; white-space: pre-wrap; }
  .block-content p:last-child { margin-bottom: 0; }
  .block-content ul, .block-content ol { margin: 8px 0 0; padding-inline-start: 22px; }
  .block-content li { margin-bottom: 4px; }

  .copy-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: var(--primary-light); }
  .copy-btn.copied { background: var(--success); }
  .copy-btn.copied::before { content: "✓ "; }

  .copy-all-bar {
    display: flex;
    justify-content: flex-start;
    gap: 8px;
    margin-bottom: 18px;
  }
  .copy-all-btn {
    background: white;
    color: var(--primary);
    border: 1.5px solid var(--primary);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .copy-all-btn:hover { background: var(--primary); color: white; }
  .copy-all-btn.copied { background: var(--success); color: white; border-color: var(--success); }
  .copy-all-btn.copied::before { content: "✓ "; }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .welcome h2 {
    color: var(--primary);
    margin-bottom: 12px;
  }

  .signature {
    margin-top: 24px;
    padding: 16px 26px;
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.8;
  }
  .signature div:first-child { margin-bottom: 2px; }

  .disclaimer {
    margin-top: 32px;
    padding: 16px 20px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  @media (max-width: 768px) {
    #menu-toggle { display: block; }
    header h1 { font-size: 16px; }
    aside {
      position: fixed;
      top: 60px;
      right: 0;
      bottom: 0;
      width: 280px;
      transform: translateX(100%);
      transition: transform 0.2s;
      z-index: 9;
      box-shadow: -4px 0 12px rgba(0,0,0,0.1);
    }
    aside.open { transform: translateX(0); }
    main { padding: 20px 16px; }
    main h2 { font-size: 22px; }
    .block { padding: 16px 18px; }
    .block-header { flex-direction: column; align-items: stretch; }
    .copy-btn { align-self: flex-start; }
    .overlay {
      display: none;
      position: fixed;
      top: 60px; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,0.4);
      z-index: 8;
    }
    .overlay.show { display: block; }
  }
</style>
</head>
<body>

<header>
  <button id="menu-toggle" aria-label="פתח תפריט">☰</button>
  <h1>קטעי טקסט · הריון בסיכון גבוה</h1>
  <input type="search" id="search" placeholder="חיפוש נושא...">
</header>

<div class="layout">
  <aside id="sidebar">
    <ul id="topic-list"></ul>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main id="content">
    <div class="welcome">
      <h2>בחר נושא מהתפריט</h2>
      <p>או חפש בתיבה למעלה</p>
    </div>
  </main>
</div>

<script src="topics.js"></script>
<script>
(function() {
  const list = document.getElementById('topic-list');
  const content = document.getElementById('content');
  const search = document.getElementById('search');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuToggle = document.getElementById('menu-toggle');

  function slugify(s) {
    return s.replace(/[^֐-׿a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  }

  function renderList(filter) {
    list.innerHTML = '';
    const q = (filter || '').trim().toLowerCase();
    const matches = TOPICS.filter(t => {
      if (!q) return true;
      const hay = (t.title + ' ' + (t.aliases || []).join(' ') + ' ' +
                   (t.discussion || '') + ' ' + (t.recommendations || '') + ' ' +
                   (t.warnings_intro || '') + ' ' + (t.warnings_items || []).join(' ')).toLowerCase();
      return hay.includes(q);
    });
    if (matches.length === 0) {
      list.innerHTML = '<li class="no-results">אין תוצאות</li>';
      return;
    }
    let lastGroup = null;
    matches.forEach(t => {
      if (t.group && t.group !== lastGroup) {
        const lab = document.createElement('li');
        lab.className = 'group-label';
        lab.textContent = t.group;
        list.appendChild(lab);
        lastGroup = t.group;
      } else if (!t.group && lastGroup !== null) {
        lastGroup = null;
      }
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + t.id;
      a.textContent = t.title;
      a.dataset.id = t.id;
      li.appendChild(a);
      list.appendChild(li);
    });
    highlightActive();
  }

  function highlightActive() {
    const id = (location.hash || '').slice(1);
    document.querySelectorAll('#topic-list a').forEach(a => {
      a.classList.toggle('active', a.dataset.id === id);
    });
  }

  function generalRecsText() {
    const g = window.GENERAL_RECS || {};
    const items = (g.items || []).map((x, i) => (i + 1) + '. ' + x).join('\n');
    return (g.intro || '') + (items ? '\n' + items : '');
  }

  function getSignature(topic) {
    if (topic.type === 'postpartum') return window.SIGNATURE_POSTPARTUM || window.SIGNATURE;
    return window.SIGNATURE;
  }

  function buildBlockText(topic) {
    const parts = [];
    if (topic.template) {
      parts.push(topic.template);
      if (getSignature(topic)) parts.push(getSignature(topic));
      return parts.join('\n\n');
    }
    if (topic.discussion) parts.push(topic.discussion);
    if (topic.recommendations) parts.push(topic.recommendations);
    if (!topic.is_us_finding) {
      parts.push(generalRecsText());
      if (topic.warnings_intro || (topic.warnings_items || []).length) {
        const wi = (topic.warnings_items || []).map(x => '• ' + x).join('\n');
        parts.push((topic.warnings_intro || '') + (wi ? '\n' + wi : ''));
      }
    }
    if (getSignature(topic)) parts.push(getSignature(topic));
    return parts.join('\n\n');
  }

  function copyText(text, btnEl) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btnEl.textContent;
      btnEl.classList.add('copied');
      btnEl.textContent = 'הועתק';
      setTimeout(() => {
        btnEl.classList.remove('copied');
        btnEl.textContent = orig;
      }, 1500);
    }).catch(err => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      btnEl.classList.add('copied');
      const orig = btnEl.textContent;
      btnEl.textContent = 'הועתק';
      setTimeout(() => {
        btnEl.classList.remove('copied');
        btnEl.textContent = orig;
      }, 1500);
    });
  }

  function renderTopic(id) {
    const topic = TOPICS.find(t => t.id === id);
    if (!topic) {
      content.innerHTML = '<div class="welcome"><h2>בחר נושא מהתפריט</h2><p>או חפש בתיבה למעלה</p></div>';
      return;
    }

    const g = window.GENERAL_RECS || {};
    const showGeneral = !topic.template && !topic.is_us_finding;
    const showWarnings = !topic.template && !topic.is_us_finding && (topic.warnings_intro || (topic.warnings_items || []).length);

    const templateHtml = topic.template ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">תבנית</h3>
          <button class="copy-btn" data-block="template">העתק</button>
        </div>
        <div class="block-content"><p style="white-space: pre-wrap;">${escapeHtml(topic.template)}</p></div>
      </div>` : '';

    const generalRecsHtml = showGeneral ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">המלצות כלליות</h3>
          <button class="copy-btn" data-block="general">העתק</button>
        </div>
        <div class="block-content">
          ${g.intro ? `<p>${escapeHtml(g.intro)}</p>` : ''}
          ${(g.items || []).length ? `<ol>${g.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ol>` : ''}
        </div>
      </div>` : '';

    const warningsHtml = showWarnings ? `
      <div class="block block-warn">
        <div class="block-header">
          <h3 class="block-title">סימני אזהרה</h3>
          <button class="copy-btn" data-block="warnings">העתק</button>
        </div>
        <div class="block-content">
          ${topic.warnings_intro ? `<p>${escapeHtml(topic.warnings_intro)}</p>` : ''}
          ${(topic.warnings_items || []).length ? `<ul>${topic.warnings_items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>` : ''}
        </div>
      </div>` : '';

    const sig = getSignature(topic);
    const signatureHtml = sig ? `
      <div class="signature">
        ${sig.split('\n').map(line => `<div>${escapeHtml(line)}</div>`).join('')}
      </div>` : '';

    const showDiscussion = !topic.template && topic.discussion;
    const showRecs = !topic.template && topic.recommendations;

    content.innerHTML = `
      <h2>${escapeHtml(topic.title)}</h2>
      ${topic.group ? `<div class="topic-meta">${escapeHtml(topic.group)}</div>` : '<div class="topic-meta"></div>'}

      <div class="copy-all-bar">
        <button class="copy-all-btn" data-action="copy-all">העתק את כל הטקסט</button>
      </div>

      ${templateHtml}

      ${showDiscussion ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">שיחה והסבר</h3>
          <button class="copy-btn" data-block="discussion">העתק</button>
        </div>
        <div class="block-content"><p>${escapeHtml(topic.discussion)}</p></div>
      </div>` : ''}

      ${showRecs ? `
      <div class="block">
        <div class="block-header">
          <h3 class="block-title">המלצות ומעקב</h3>
          <button class="copy-btn" data-block="recommendations">העתק</button>
        </div>
        <div class="block-content"><p>${escapeHtml(topic.recommendations)}</p></div>
      </div>` : ''}

      ${generalRecsHtml}

      ${warningsHtml}

      ${signatureHtml}

      <div class="disclaimer">
        הטקסטים נכתבו לשימוש כקטעים במכתבי סיכום ביקור. התאם בכל מקרה למצבה הספציפי של המטופלת.
      </div>
    `;

    content.querySelectorAll('button.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const which = btn.dataset.block;
        let text = '';
        if (which === 'template') text = topic.template;
        else if (which === 'discussion') text = topic.discussion;
        else if (which === 'recommendations') text = topic.recommendations;
        else if (which === 'general') text = generalRecsText();
        else if (which === 'warnings') {
          const items = (topic.warnings_items || []).map(x => '• ' + x).join('\n');
          text = (topic.warnings_intro || '') + (items ? '\n' + items : '');
        }
        copyText(text, btn);
      });
    });
    content.querySelectorAll('button.copy-all-btn').forEach(btn => {
      btn.addEventListener('click', () => copyText(buildBlockText(topic), btn));
    });

    if (window.innerWidth <= 768) {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
    content.scrollTo(0, 0);
    window.scrollTo(0, 0);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function onHashChange() {
    const id = (location.hash || '').slice(1);
    renderTopic(id);
    highlightActive();
  }

  search.addEventListener('input', e => renderList(e.target.value));
  window.addEventListener('hashchange', onHashChange);
  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });

  renderList('');
  onHashChange();
})();
</script>
</body>
</html>
