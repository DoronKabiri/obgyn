<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>קטעי טקסט – הריון בסיכון גבוה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1F4E79;
    --primary-light: #4472A8;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --hover: #eef4fb;
    --success: #16a34a;
    --warn-bg: #fff7ed;
    --warn-border: #fed7aa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 14px 22px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    flex-shrink: 0;
  }
  #search {
    flex: 1;
    max-width: 480px;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: background 0.15s;
  }
  #search::placeholder { color: rgba(255,255,255,0.7); }
  #search:focus { background: rgba(255,255,255,0.25); }

  #menu-toggle {
    display: none;
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    font-size: 20px;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
  }

  .layout {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
    min-height: calc(100vh - 60px);
  }

  aside {
    width: 280px;
    flex-shrink: 0;
    background: var(--card-bg);
    border-inline-start: 1px solid var(--border);
    overflow-y: auto;
    height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }
  aside ul {
    list-style: none;
    padding: 8px 0;
    margin: 0;
  }
  aside li a {
    display: block;
    padding: 10px 22px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    border-inline-end: 3px solid transparent;
    transition: background 0.1s, border-color 0.1s;
  }
  aside li a:hover { background: var(--hover); }
  aside li a.active {
    background: var(--hover);
    border-inline-end-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  aside .group-label {
    padding: 14px 22px 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  aside .no-results {
    padding: 22px;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
  }

  main {
    flex: 1;
    padding: 32px 36px;
    max-width: 900px;
  }
  main h2 {
    font-size: 28px;
    color: var(--primary);
    margin: 0 0 8px;
    font-weight: 700;
  }
  main .topic-meta {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 18px;
    position: relative;
  }
  .block-warn {
    background: var(--warn-bg);
    border-color: var(--warn-border);
  }
  .block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
  }
  .block-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
  }
  .block-warn .block-title { color: #c2410c; }
  .block-content {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
  }
  .block-content p { margin: 0 0 10px; white-space: pre-wrap; }
  .block-content p:last-child { margin-bottom: 0; }
  .block-content ul, .block-content ol { margin: 8px 0 0; padding-inline-start: 22px; }
  .block-content li { margin-bottom: 4px; }

  .copy-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: var(--primary-light); }
  .copy-btn.copied { background: var(--success); }
  .copy-btn.copied::before { content: "✓ "; }

  .copy-all-bar {
    display: flex;
    justify-content: flex-start;
    gap: 8px;
    margin-bottom: 18px;
  }
  .copy-all-btn {
    background: white;
    color: var(--primary);
    border: 1.5px solid var(--primary);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .copy-all-btn:hover { background: var(--primary); color: white; }
  .copy-all-btn.copied { background: var(--success); color: white; border-color: var(--success); }
  .copy-all-btn.copied::before { content: "✓ "; }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .welcome h2 {
    color: var(--primary);
    margin-bottom: 12px;
  }

  .signature {
    margin-top: 24px;
    padding: 16px 26px;
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.8;
  }
  .signature div:first-child { margin-bottom: 2px; }

  .disclaimer {
    margin-top: 32px;
    padding: 16px 20px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  /* ===== Calculator UI ===== */
  .calc-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 18px;
  }
  .calc-card h3 {
    margin: 0 0 14px;
    color: var(--primary);
    font-size: 16px;
    font-weight: 700;
  }
  .calc-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-bottom: 12px;
  }
  .calc-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 140px;
  }
  .calc-field label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .calc-field input, .calc-field select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    background: white;
  }
  .calc-field input:focus, .calc-field select:focus {
    outline: 2px solid var(--primary-light);
    outline-offset: -1px;
  }
  .calc-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-btn:hover { background: var(--primary-light); }
  .calc-result {
    margin-top: 14px;
    padding: 14px 18px;
    background: var(--hover);
    border-inline-start: 3px solid var(--primary);
    border-radius: 6px;
    font-size: 15px;
    line-height: 1.7;
  }
  .calc-result .result-line { margin-bottom: 4px; }
  .calc-result .result-line:last-child { margin-bottom: 0; }
  .calc-result strong { color: var(--primary); }
  .calc-result.warn {
    background: var(--warn-bg);
    border-inline-start-color: #f59e0b;
  }
  .calc-result .copy-summary-btn {
    margin-top: 10px;
    background: white;
    color: var(--primary);
    border: 1.5px solid var(--primary);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-result .copy-summary-btn:hover { background: var(--primary); color: white; }
  .calc-result .copy-summary-btn.copied { background: var(--success); color: white; border-color: var(--success); }
  .calc-result .copy-summary-btn.copied::before { content: "✓ "; }
  .calc-help {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ===== Login overlay ===== */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #login-overlay.hidden { display: none; }
  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  .login-card h2 {
    color: var(--primary);
    margin: 0 0 8px;
    font-size: 22px;
  }
  .login-card .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .login-card input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
  }
  .login-card input[type="password"]:focus { border-color: var(--primary); }
  .login-card button {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .login-card button:hover { background: var(--primary-light); }
  .login-card button:disabled { opacity: 0.6; cursor: wait; }
  .login-error {
    color: #b91c1c;
    font-size: 14px;
    margin-top: 10px;
    min-height: 20px;
  }
  #logout-btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  #logout-btn:hover { background: rgba(255,255,255,0.25); }

  @media (max-width: 768px) {
    #menu-toggle { display: block; }
    header h1 { font-size: 16px; }
    aside {
      position: fixed;
      top: 60px;
      right: 0;
      bottom: 0;
      width: 280px;
      transform: translateX(100%);
      transition: transform 0.2s;
      z-index: 9;
      box-shadow: -4px 0 12px rgba(0,0,0,0.1);
    }
    aside.open { transform: translateX(0); }
    main { padding: 20px 16px; }
    main h2 { font-size: 22px; }
    .block { padding: 16px 18px; }
    .block-header { flex-direction: column; align-items: stretch; }
    .copy-btn { align-self: flex-start; }
    .overlay {
      display: none;
      position: fixed;
      top: 60px; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,0.4);
      z-index: 8;
    }
    .overlay.show { display: block; }
  }
</style>
</head>

  <form class="login-card" id="login-form">
    <h2>קטעי טקסט · הריון בסיכון גבוה</h2>
    <div class="subtitle">נדרשת סיסמה לכניסה.</div>
    <input type="password" id="login-password" placeholder="סיסמה" autocomplete="current-password" autofocus required>
    <button type="submit" id="login-btn">כניסה</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<header>
  <button id="menu-toggle" aria-label="פתח תפריט">☰</button>
  <h1>קטעי טקסט · הריון בסיכון גבוה</h1>
  <input type="search" id="search" placeholder="חיפוש נושא...">
  <button id="logout-btn" type="button">התנתק</button>
</header>

<div class="layout">
  <aside id="sidebar">
    <ul id="topic-list"></ul>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main id="content">
    <div class="welcome">
      <h2>בחר נושא מהתפריט</h2>
      <p>או חפש בתיבה למעלה</p>
    </div>
  </main>
</div>

<script src="topics.enc.js?v=8"></script>
<script>
/* ===== Login & decryption ===== */
async function decryptTopics(encryptedB64, password, iterations) {
  const blob = Uint8Array.from(atob(encryptedB64), c => c.charCodeAt(0));
  const salt = blob.slice(0, 16);
  const iv = blob.slice(16, 28);
  const ciphertext = blob.slice(28);
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password),
    {name: 'PBKDF2'}, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256'},
    keyMaterial,
    {name: 'AES-GCM', length: 256},
    false, ['decrypt']
  );
  const plaintextBuffer = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: iv}, key, ciphertext
  );
  return new TextDecoder().decode(plaintextBuffer);
}

function runAppCode(code) {
  // Execute the decrypted JS (defines window.TOPICS, etc.)
  const s = document.createElement('script');
  s.textContent = code;
  document.head.appendChild(s);
}

(function loginInit() {
  const form = document.getElementById('login-form');
  const pwField = document.getElementById('login-password');
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  const overlay = document.getElementById('login-overlay');

  // Try auto-login from sessionStorage
  const saved = sessionStorage.getItem('obgyn-decrypted');
  if (saved) {
    try {
      runAppCode(saved);
      overlay.classList.add('hidden');
      initApp();
      return;
    } catch (e) {
      sessionStorage.removeItem('obgyn-decrypted');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = pwField.value;
    if (!pw) return;
    btn.disabled = true;
    btn.textContent = 'מפענח...';
    errEl.textContent = '';
    try {
      const code = await decryptTopics(window.ENCRYPTED_TOPICS, pw, window.PBKDF2_ITERATIONS || 250000);
      runAppCode(code);
      sessionStorage.setItem('obgyn-decrypted', code);
      overlay.classList.add('hidden');
      initApp();
    } catch (err) {
      errEl.textContent = 'סיסמה שגויה. נסה שוב.';
      btn.disabled = false;
      btn.textContent = 'כניסה';
      pwField.select();
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('obgyn-decrypted');
    location.reload();
  });
})();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDateIL(date) {
  if (!date || isNaN(date)) return '—';
  const d = String(date.getDate()).padStart(2, '0');
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const y = date.getFullYear();
  return `${d}/${m}/${y}`;
}

function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / 86400000);
}

function todayISO() {
  const now = new Date();
  const offset = now.getTimezoneOffset();
  return new Date(now.getTime() - offset * 60000).toISOString().split('T')[0];
}

function computeGAFromLMP(lmpStr, todayStr) {
  const lmp = new Date(lmpStr + 'T00:00:00');
  const today = new Date(todayStr + 'T00:00:00');
  if (isNaN(lmp) || isNaN(today)) return null;
  const diffDays = daysBetween(lmp, today);
  if (diffDays < 0 || diffDays > 320) return null;
  const weeks = Math.floor(diffDays / 7);
  const days = diffDays % 7;
  const edd = new Date(lmp.getTime() + 280 * 86400000);
  const w38Start = new Date(lmp.getTime() + 259 * 86400000); // 37+0
  const w38End = new Date(lmp.getTime() + 265 * 86400000);   // 37+6
  const daysToEdd = daysBetween(today, edd);
  return { weeks, days, edd, daysToEdd, lmp, w38Start, w38End };
}

function computeGAFromKnownGA(weeks, days, atDateStr, todayStr) {
  const atDate = new Date(atDateStr + 'T00:00:00');
  if (isNaN(atDate) || weeks == null || days == null) return null;
  const gaDays = weeks * 7 + days;
  const lmp = new Date(atDate.getTime() - gaDays * 86400000);
  const lmpStr = lmp.toISOString().split('T')[0];
  return computeGAFromLMP(lmpStr, todayStr);
}

function getPercentileFor(measure, value, gaWeeks, gaDays) {
  const cfg = PCT_TABLES[measure];
  if (!cfg) return null;
  const tbl = cfg.table;
  const gaDecimal = gaWeeks + gaDays / 7;
  const lower = Math.floor(gaDecimal);
  const upper = lower + 1;
  if (!tbl[lower]) return null;
  const frac = gaDecimal - lower;
  const upTbl = tbl[upper] || tbl[lower];
  const interp = tbl[lower].map((v, i) => v + (upTbl[i] - v) * frac);
  return interpolatePercentile(value, interp);
}

function interpolatePercentile(value, [p3, p10, p50, p90, p97]) {
  let p;
  if (value < p3) p = Math.max(0.5, 3 * (value / p3));
  else if (value < p10) p = 3 + (10 - 3) * (value - p3) / (p10 - p3);
  else if (value < p50) p = 10 + (50 - 10) * (value - p10) / (p50 - p10);
  else if (value < p90) p = 50 + (90 - 50) * (value - p50) / (p90 - p50);
  else if (value < p97) p = 90 + (97 - 90) * (value - p90) / (p97 - p90);
  else p = Math.min(99.5, 97 + (value - p97) / Math.max(1, (p97 - p90)) * 3);
  return { percentile: p, p3, p10, p50, p90, p97 };
}

function renderCalculatorFWP(content) {
  const fields = Object.entries(PCT_TABLES).map(([k, v]) => `

  content.innerHTML = `
    <h2>אחוזון מדדי אולטרסאונד עוברי</h2>
    <div class="topic-meta">מחשבונים וכלים</div>

    <div class="calc-card">
      <div class="calc-row">
        <div class="calc-field"><label>שבועות</label><input type="number" id="us-w" min="14" max="42" step="1" placeholder="32"></div>
        <div class="calc-field"><label>ימים</label><input type="number" id="us-d" min="0" max="6" step="1" value="0"></div>
        <button class="calc-btn" id="calc-us-btn" style="align-self: flex-end;">חשב</button>
      </div>
      <div style="border-top: 1px solid var(--border); margin: 14px 0 12px; padding-top: 12px;">
        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">הזן ערכים רק במדדים שמעניינים אותך — השאר ריקים את השאר.</div>
        ${fields}
      </div>
      <div class="calc-help">טווח שבועות נתמך: 14-40. EFW, BPD, AC, FL לפי Hadlock; HC לפי Chervenak.</div>
      <div id="us-result"></div>
    </div>
  `;

  document.getElementById('calc-us-btn').addEventListener('click', () => {
    const w = parseInt(document.getElementById('us-w').value);
    const d = parseInt(document.getElementById('us-d').value) || 0;
    const out = document.getElementById('us-result');
    if (!w || w < 14 || w > 42) {
      out.innerHTML = '<div class="calc-result warn">יש להזין שבועות (14-42) וימים (0-6).</div>';
      return;
    }
    const results = [];
    for (const [k, cfg] of Object.entries(PCT_TABLES)) {
      const raw = document.getElementById(`us-v-${k}`).value;
      if (raw === '' || raw === null) continue;
      const v = parseFloat(raw);
      if (isNaN(v) || v <= 0) continue;
      const r = getPercentileFor(k, v, w, d);
      if (!r) continue;
      results.push({ k, cfg, v, r, cls: cfg.classify(r.percentile) });
    }
    if (results.length === 0) {
      out.innerHTML = '<div class="calc-result warn">לא הוזן אף ערך. הזן ערך לפחות במדד אחד.</div>';
      return;
    }
    const hasWarn = results.some(x => x.cls.cls === 'warn');
    const round = (n, unit) => unit === 'גרם' ? Math.round(n) : Math.round(n * 10) / 10;
    const pDisp = (p) => p < 1 ? '<1' : p > 99 ? '>99' : Math.round(p);

    const resultLines = results.map(({ k, cfg, v, r, cls }) => {
      const p = pDisp(r.percentile);
      const cssMark = cls.cls === 'warn' ? '⚠️ ' : '';
      return `<div class="result-line">
        <strong>${cfg.label}:</strong> ${v} ${cfg.unit} → אחוזון <strong>${p}</strong> · ${cssMark}${cls.label}
        <span style="color: var(--text-muted); font-size: 13px;"> (טווח 10-90: ${round(r.p10, cfg.unit)}-${round(r.p90, cfg.unit)} ${cfg.unit})</span>
      </div>`;
    }).join('');

    const summaryLines = results.map(({ cfg, v, r }) =>
      `${cfg.label}: ${v} ${cfg.unit} (אחוזון ${pDisp(r.percentile)})`
    ).join('; ');
    const summary = `מדדי אולטרסאונד בשבוע ${w}+${d}: ${summaryLines}.`;

    out.innerHTML = `
      <div class="calc-result ${hasWarn ? 'warn' : ''}">
        <div class="result-line" style="margin-bottom: 10px;"><strong>גיל הריון:</strong> ${w}+${d}</div>
        ${resultLines}
        <button class="copy-summary-btn" data-text="${escapeHtml(summary)}">העתק סיכום לכל המדדים</button>
      </div>
    `;
    attachCopySummary(out);
  });
}

function attachCopySummary(parentEl) {
  parentEl.querySelectorAll('.copy-summary-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.getAttribute('data-text').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.classList.add('copied');
        btn.textContent = 'הועתק';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 1500);
      });
    });
  });
}

function initApp() {
  const list = document.getElementById('topic-list');
  const content = document.getElementById('content');
  const search = document.getElementById('search');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuToggle = document.getElementById('menu-toggle');

  function slugify(s) {
    return s.replace(/[^֐-׿a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  }

  function renderList(filter) {
    list.innerHTML = '';
    const q = (filter || '').trim().toLowerCase();
    const matches = TOPICS.filter(t => {
      if (!q) return true;
      const hay = (t.title + ' ' + (t.aliases || []).join(' ') + ' ' +
                   (t.discussion || '') + ' ' + (t.recommendations || '') + ' ' +
                   (t.warnings_intro || '') + ' ' + (t.warnings_items || []).join(' ')).toLowerCase();
      return hay.includes(q);
    });
    if (matches.length === 0) {
      list.innerHTML = '<li class="no-results">אין תוצאות</li>';
      return;
    }
    let lastGroup = null;
    matches.forEach(t => {
      if (t.group && t.group !== lastGroup) {
        const lab = document.createElement('li');
        lab.className = 'group-label';
        lab.textContent = t.group;
        list.appendChild(lab);
        lastGroup = t.group;
      } else if (!t.group && lastGroup !== null) {
        lastGroup = null;
      }
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + t.id;
      a.textContent = t.title;
      a.dataset.id = t.id;
      li.appendChild(a);
      list.appendChild(li);
    });
    highlightActive();
  }

  function highlightActive() {
    const id = (location.hash || '').slice(1);
    document.querySelectorAll('#topic-list a').forEach(a => {
      a.classList.toggle('active', a.dataset.id === id);
    });
  }

  function generalRecsText() {
    const g = window.GENERAL_RECS || {};
    const items = (g.items || []).map((x, i) => (i + 1) + '. ' + x).join('\n');
    return (g.intro || '') + (items ? '\n' + items : '');
  }

  function getSignature(topic) {
    if (topic.type === 'postpartum') return window.SIGNATURE_POSTPARTUM || window.SIGNATURE;
    return window.SIGNATURE;
  }

  function buildBlockText(topic) {
    const parts = [];
    if (topic.template) {
      parts.push(topic.template);
      if (getSignature(topic)) parts.push(getSignature(topic));
      return parts.join('\n\n');
    }
    if (topic.discussion) parts.push(topic.discussion);
    if (topic.recommendations) parts.push(topic.recommendations);
    if (!topic.is_us_finding) {
      parts.push(generalRecsText());
      if (topic.warnings_intro || (topic.warnings_items || []).length) {
        const wi = (topic.warnings_items || []).map(x => '• ' + x).join('\n');
        parts.push((topic.warnings_intro || '') + (wi ? '\n' + wi : ''));
      }
    }
    if (getSignature(topic)) parts.push(getSignature(topic));
    return parts.join('\n\n');
  }

    navigator.clipboard.writeText(text).then(() => {
      const orig = btnEl.textContent;
      btnEl.classList.add('copied');
      btnEl.textContent = 'הועתק';
      setTimeout(() => {
        btnEl.classList.remove('copied');
        btnEl.textContent = orig;

      // Fallback

      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}

      btnEl.classList.add('copied');
      const orig = btnEl.textContent;

    content.querySelectorAll('button.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const which = btn.dataset.block;
        let text = '';
        if (which === 'template') text = topic.template;
        else if (which === 'discussion') text = topic.discussion;
        else if (which === 'recommendations') text = topic.recommendations;
        else if (which === 'general') text = generalRecsText();
        else if (which === 'warnings') {
          const items = (topic.warnings_items || []).map(x => '• ' + x).join('\n');
          text = (topic.warnings_intro || '') + (items ? '\n' + items : '');
        }
        copyText(text, btn);
      });
    });
    content.querySelectorAll('button.copy-all-btn').forEach(btn => {
      btn.addEventListener('click', () => copyText(buildBlockText(topic), btn));
    });

    if (window.innerWidth <= 768) {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
    content.scrollTo(0, 0);
    window.scrollTo(0, 0);
  }

  function onHashChange() {
    const id = (location.hash || '').slice(1);
    renderTopic(id);
    highlightActive();
  }

  search.addEventListener('input', e => renderList(e.target.value));
  window.addEventListener('hashchange', onHashChange);
  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });

  renderList('');
  onHashChange();
}
</script>
</body>
</html>
